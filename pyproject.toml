[project]
name = "omarchy-dictation"
version = "0.2.0"
description = "Standalone Omarchy voice input with live waveforms, Scribe recognition and LLM cleanup"
requires-python = ">=3.11"
dependencies = ["websockets==15.0.1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
