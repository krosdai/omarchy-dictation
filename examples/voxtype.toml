# Merge these settings into existing sections; do not duplicate TOML tables.
engine = "whisper"

[whisper]
mode = "remote"
remote_endpoint = "http://127.0.0.1:8765"
remote_model = "grok-voice-transcribe-2.0"
remote_timeout_secs = 65
language = "auto"
translate = false

[output]
mode = "type"
fallback_to_clipboard = true
wait_for_modifier_release = true
modifier_release_timeout_ms = 2000

[profiles.translate]
post_process_command = "python3 ~/.local/share/omarchy-dictation/dictation.py translate"
post_process_timeout_ms = 30000
